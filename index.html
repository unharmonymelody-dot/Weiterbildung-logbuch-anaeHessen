<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#13605a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Weiterbildungs-Logbuch Anästhesiologie</title>
<style>
:root{
  --bg:#f3f6f5; --card:#ffffff; --text:#18302d; --muted:#5d716e; --line:#dbe5e3;
  --pri:#1b7a73; --pri-d:#13605a; --on-pri:#ffffff; --pri-soft:#e1f1ef;
  --ok:#2b8a57; --ok-soft:#e3f4ea; --warn:#9a5b00; --warn-soft:#fff2d9; --danger:#b3372f;
  --shadow:0 1px 2px rgba(20,50,46,.08),0 4px 14px rgba(20,50,46,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1615; --card:#162220; --text:#e5efed; --muted:#97aeaa; --line:#25403c;
    --pri:#4cbfb5; --pri-d:#7fd6cd; --on-pri:#06201d; --pri-soft:#173b37;
    --ok:#58c487; --ok-soft:#14301f; --warn:#f0b24a; --warn-soft:#3b2d12; --danger:#ef8179;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.top{background:#13605a;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.top h1{font-size:1.1rem;font-weight:650}
.top p{margin:2px 0 0;font-size:.82rem;opacity:.9}
.wrap{max-width:780px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card h2{font-size:1.05rem;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;min-height:58px;cursor:pointer}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--pri);font-weight:650}
.tabs button[aria-current="page"] svg{stroke-width:2.2}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;padding:0 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.soft{background:var(--pri-soft);border-color:transparent;color:var(--pri-d)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:44px;min-width:44px;padding:0 12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.plus{min-width:72px;font-size:1.1rem}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

/* Felder */
label.f{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px}
textarea{min-height:80px}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
@media(min-width:620px){.filters.cols{grid-template-columns:2fr 2fr auto}}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 4px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--pri)}

/* Tagesleiste */
.daybar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0 8px;display:grid;grid-template-columns:48px 1fr 48px auto;gap:8px;align-items:center}
.daybar input{text-align:center;font-weight:600}
.daysum{font-size:.9rem;color:var(--muted);margin:2px 2px 10px}

/* Fortschritt */
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .25s}
.bar.ok>i{background:var(--ok)}
.bar.lg{height:14px}
.big{font-size:2.1rem;font-weight:700;line-height:1}
.stat{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:8px 0 6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.85rem}
.kv b{display:block;font-size:1.05rem}

/* Kategorien */
details.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
details.cat>summary{list-style:none;cursor:pointer;padding:12px 16px;min-height:56px;display:block}
details.cat>summary::-webkit-details-marker{display:none}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chead h3{font-size:.98rem;font-weight:650}
.chead .pct{font-weight:700;color:var(--pri);white-space:nowrap}
.chead .pct.ok{color:var(--ok)}
.cmeta{font-size:.78rem;color:var(--muted);margin:3px 0 7px}
.chev{display:inline-block;transition:transform .15s;margin-right:4px;color:var(--muted)}
details[open] .chev{transform:rotate(90deg)}
.grp{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 16px 4px;background:var(--bg);border-top:1px solid var(--line)}

/* Zeilen */
.row{padding:12px 16px;border-top:1px solid var(--line)}
.row.sub{padding-left:34px;background:var(--bg);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.row.click{cursor:pointer}
.rtitle{font-size:.95rem}
.tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;background:var(--pri-soft);color:var(--pri-d)}
.tag.K{background:#e9e6f7;color:#4a3d94}
@media(prefers-color-scheme:dark){.tag.K{background:#2a2550;color:#b9b0f5}}
.rmeta{font-size:.82rem;color:var(--muted);margin-top:3px}
.rmeta b{color:var(--text)}
.rbottom{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.rbottom .l{flex:1 1 150px;min-width:130px}
.rctl{display:flex;align-items:center;gap:6px}
.cnt{min-width:30px;text-align:center;font-weight:700;font-size:1.1rem}
.done-badge{color:var(--ok);font-weight:650}
.tog{min-width:150px}
.tog.on{background:var(--ok);border-color:var(--ok);color:#fff}
.note{font-style:italic}
.pill{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 8px;background:var(--pri-soft);color:var(--pri-d);margin-left:4px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* Verlauf */
.dayhead{font-weight:650;margin:14px 2px 6px;display:flex;justify-content:space-between}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.entry .n{background:var(--pri-soft);color:var(--pri-d);font-weight:700;border-radius:10px;min-width:44px;text-align:center;padding:6px 4px}
.entry .t{font-size:.92rem}
.entry .c{font-size:.75rem;color:var(--muted)}

/* Banner / Toast */
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.9rem}
.banner .btn,.info .btn{margin:8px 8px 0 0;min-height:44px}
.info{background:var(--pri-soft);color:var(--text);border-radius:12px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast .t{pointer-events:auto;background:#22312f;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:560px;font-size:.92rem}
#toast button{background:none;border:0;color:#8fe3d9;font-weight:700;min-height:40px;padding:0 8px;cursor:pointer}

/* Dialoge */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,15,14,.5)}
.dbody{padding:18px;max-height:90vh;overflow:auto}
.dbody h2{font-size:1.1rem;margin-bottom:4px}
.dact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.dact .btn{flex:1 1 120px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper input{text-align:center;font-weight:700;font-size:1.2rem}

#report{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:10.5pt}
  body>*:not(#report){display:none!important}
  #report{display:block!important}
  #report h1{font-size:16pt;margin:0 0 2pt}
  #report h2{font-size:12pt;margin:14pt 0 4pt;border-bottom:1px solid #444;padding-bottom:2pt;break-after:avoid}
  #report table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:6pt}
  #report th,#report td{border:1px solid #999;padding:3pt 5pt;vertical-align:top;text-align:left}
  #report th{background:#e8e8e8}
  #report tr{break-inside:avoid}
  #report .r{text-align:right;white-space:nowrap}
  #report .sub td:first-child{padding-left:16pt}
  #report .sig{margin-top:30pt;display:flex;gap:30pt}
  #report .sig div{flex:1;border-top:1px solid #000;padding-top:3pt;font-size:9pt}
}
</style>
</head>

let storageOK=true;
function fresh(){return {app:APP_ID,version:1,entries:[],segments:[],settings:{name:'',rollup:true,lastBackup:null}};}
function validEntry(e){return e&&typeof e.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.d)&&typeof e.i==='string'&&Number.isFinite(e.n)&&e.n>0;}
function validSeg(s){return s&&typeof s.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s.start)&&SEG_TYPES[s.type];}
function norm(o){
  const f=fresh(); if(!o||typeof o!=='object') return f;
  f.entries=(Array.isArray(o.entries)?o.entries:[]).filter(validEntry).map(e=>({id:e.id,d:e.d,i:e.i,n:Math.floor(e.n),note:String(e.note||''),sim:!!e.sim}));
  f.segments=(Array.isArray(o.segments)?o.segments:[]).filter(validSeg).map(s=>({id:s.id,type:s.type,dept:String(s.dept||''),boss:String(s.boss||''),start:s.start,end:/^\d{4}-\d{2}-\d{2}$/.test(s.end||'')?s.end:'',gap:Math.max(0,Math.floor(s.gap||0))}));
  Object.assign(f.settings,{name:String((o.settings&&o.settings.name)||''),rollup:!(o.settings&&o.settings.rollup===false),lastBackup:(o.settings&&o.settings.lastBackup)||null});
  return f;
}

/* ========== Berechnungen ========== */
function computeStats(){
  const st={};
  ITEMS.forEach(it=>st[it.id]={real:0,sim:0,days:new Set(),first:null,last:null});
  S.entries.forEach(e=>{
    const s=st[e.i]; if(!s) return;
    if(e.sim) s.sim+=e.n; else s.real+=e.n;
    s.days.add(e.d);
    if(!s.first||e.d<s.first) s.first=e.d;
    if(!s.last||e.d>s.last) s.last=e.d;
  });
  ITEMS.forEach(it=>{
    const s=st[it.id];
    s.simCap=(it.soll&&it.sim)?Math.floor(it.soll*0.5):0;
    s.simCounted=Math.min(s.sim,s.simCap);
    s.own=s.real+s.simCounted;
  });
  ITEMS.forEach(it=>{
    const s=st[it.id]; let ist=s.own;
    if(it.soll&&S.settings.rollup) it.children.forEach(c=>{ist+=st[c.id].own;});
    s.ist=ist;
    if(it.soll){s.fehlt=Math.max(0,it.soll-ist);s.done=ist>=it.soll;s.frac=Math.min(1,ist/it.soll);}
    else{s.done=(s.real+s.sim)>0;s.fehlt=s.done?0:1;s.frac=s.done?1:0;}
  });
  return st;
}
function aggregate(items,st){
  const r={n:items.length,sum:0,nR:0,nRd:0,nI:0,nId:0};
  items.forEach(it=>{
    const s=st[it.id]; r.sum+=s.frac;
    if(it.soll){r.nR++; if(s.done) r.nRd++;} else {r.nI++; if(s.done) r.nId++;}
  });
  const all=r.n>0&&r.nRd+r.nId===r.n;
  r.pct=all?100:Math.min(99,Math.floor(r.sum/(r.n||1)*100));
  r.all=all;
  return r;
}
function segMonths(sg){
  const s=parseISO(sg.start), t=new Date(); t.setHours(0,0,0,0);
  let e=sg.end?parseISO(sg.end):t; if(e>t) e=t;
  if(e<s) return 0;
  const days=Math.round((e-s)/864e5)+1-(sg.gap||0);
  return Math.max(0,days/30.4375);
}
function timeStats(){
  let an=0,ik=0,agRaw=0,agSmall=0;
  S.segments.forEach(sg=>{
    const m=segMonths(sg);
    if(sg.type==='an') an+=m; else if(sg.type==='ik') ik+=m;
    else {if(m>=3) agRaw+=m; else agSmall+=m;}
  });
  const ag=Math.min(REQ.other,agRaw);
  const total=an+ik+ag;
  return {an,ik,agRaw,agSmall,ag,total,remaining:Math.max(0,REQ.total-total)};
}

  return `<div class="row click${it.level?' sub':''}" data-act="detail" data-id="${it.id}" role="button" tabindex="0">
    <div class="rtitle"><span class="tag ${it.k}" title="${KIND[it.k]}">${it.k}</span>${esc(it.t)}</div>
    <div class="rmeta">${metaText(it,st)}</div>${it.soll?bar(s.frac):''}
  </div>`;
}
function matchItem(it,st,f){
  const s=st[it.id];
  if(f.cat&&it.cat!==f.cat) return false;
  if(f.q){const q=f.q.toLowerCase(); if(!(it.t.toLowerCase().includes(q)||CAT_BY[it.cat].title.toLowerCase().includes(q))) return false;}
  if(f.open&&s.done) return false;
  if(f.status==='open'&&s.done) return false;
  if(f.status==='done'&&!s.done) return false;
  return true;
}
function catBlocks(st,f,mode){
  const rowFn=mode==='day'?rowDay:rowProg;
  const forceOpen=!!(f.q||f.open||f.status!=='all'&&f.status!==undefined||f.cat);
  let html='';
  CATS.forEach(c=>{
    const items=c.items.filter(it=>matchItem(it,st,f));
    if(!items.length) return;
    const a=aggregate(c.items,st);
    const isOpen=forceOpen||openCats.has(mode+c.id);
    let inner='',lastG=null;
    items.forEach(it=>{
      if(c.groups.length>1&&it.group!==lastG){inner+=`<div class="grp">${esc(it.group)}</div>`;lastG=it.group;}
      inner+=rowFn(it,st);
    });
    const meta=[];
    if(a.nR) meta.push(`Richtzahlen ${a.nRd}/${a.nR}`);
    if(a.nI) meta.push(`Inhalte abgezeichnet ${a.nId}/${a.nI}`);
    html+=`<details class="cat" data-key="${mode+c.id}"${isOpen?' open':''}>
      <summary><div class="chead"><h3><span class="chev">›</span>${esc(c.title)}</h3><span class="pct${a.all?' ok':''}">${a.pct}%</span></div>
      <div class="cmeta">${esc(c.ref)} · ${meta.join(' · ')}</div>${bar(a.pct/100)}</summary>${inner}</details>`;
  });
  return html||'<div class="card muted">Keine passenden Inhalte gefunden.</div>';
}

/* ========== Toast ========== */
let toastTimer=null;
function toast(msg,undo){
  const t=$('#toast'); clearTimeout(toastTimer);
  t.innerHTML=`<div class="t"><span>${esc(msg)}</span>${undo?'<button id="t_undo">Rückgängig</button>':''}</div>`;
  if(undo) $('#t_undo').onclick=()=>{undo();t.innerHTML='';};
  toastTimer=setTimeout(()=>{t.innerHTML='';},undo?5000:2800);
}

/* ========== Dialoge ========== */
function openDlg(html){const d=$('#dlg');d.innerHTML=`<div class="dbody">${html}</div>`;if(!d.open) d.showModal();return d;}
function closeDlg(){const d=$('#dlg');if(d.open) d.close();}
function ask({title,text,buttons}){
  return new Promise(res=>{
    const d=$('#dlgc');
    d.innerHTML=`<div class="dbody"><h2>${esc(title)}</h2><p class="small" style="margin:6px 0 0">${text}</p>
      <div class="dact">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const done=v=>{d.close();res(v);};
    d.onclick=ev=>{const b=ev.target.closest('button[data-i]'); if(b) done(buttons[+b.dataset.i].val);};
    d.oncancel=()=>res(null);
    d.showModal();
  });
}

    <p class="small" style="margin:4px 0 0"><span class="tag ${it.k}">${it.k}</span>${esc(it.t)}</p>

    ${it.soll&&it.sim?`<label class="chk"><input type="checkbox" id="e_sim"${e&&e.sim?' checked':''}>durch Simulation (höchstens 50 % der Richtzahl anrechenbar)</label>`:''}

  const d=$('#dlg');
  d.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const i=$('#e_n');i.value=Math.max(1,(parseInt(i.value,10)||1)+(+b.dataset.step));});

  const e=S.entries.find(x=>x.id===id); if(!e) return;
  const it=BY[e.i];

    <div class="rmeta" style="margin-bottom:6px">${metaText(it,st)}</div>${it.soll?bar(s.frac):''}
    ${it.soll&&S.settings.rollup&&it.children.length?'<p class="tiny muted" style="margin:6px 0 0">Zählt die Unterpunkte mit.</p>':''}
    <div class="dact"><button class="btn pri" id="x_add">+ Eintrag${it.soll?'':' (abzeichnen)'}</button><button class="btn" id="x_close">Schließen</button></div>
    ${kids}
    <h3 class="small" style="margin:14px 0 6px">Einträge (${ents.length})</h3>
    ${ents.length?ents.map(e=>`<div class="entry" style="grid-template-columns:1fr auto">
      <div><div class="t"><b>${fmtD(e.d)}</b>${it.soll?` · ×${e.n}`:''}${e.sim?'<span class="pill">Simulation</span>':''}</div>${e.note?`<div class="c note">„${esc(e.note)}“</div>`:''}</div>
      <div class="rctl"><button class="btn sm" data-edit="${e.id}" aria-label="Bearbeiten">✎</button><button class="btn sm danger" data-del="${e.id}" aria-label="Löschen">🗑</button></div></div>`).join(''):'<div class="small muted">Noch keine Einträge.</div>'}`);
  $('#x_close').onclick=closeDlg;
  $('#x_add').onclick=()=>entryDialog(it.id,null,todayISO());
  $('#dlg').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>entryDialog(it.id,b.dataset.edit));
  $('#dlg').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await deleteEntry(b.dataset.del);if($('#dlg').open) detailDialog(it.id);});
}

/* Weiterbildungsabschnitt */
function segDialog(id){
  const sg=id?S.segments.find(x=>x.id===id):null;
  openDlg(`<h2>${sg?'Abschnitt bearbeiten':'Weiterbildungsabschnitt'}</h2>
    <label class="f" for="g_type">Art</label>
    <select id="g_type">${Object.keys(SEG_TYPES).map(k=>`<option value="${k}"${sg&&sg.type===k?' selected':''}>${esc(SEG_TYPES[k])}</option>`).join('')}</select>
    <label class="f" for="g_dept">Abteilung / Weiterbildungsstätte</label>
    <input type="text" id="g_dept" value="${esc(sg?sg.dept:'')}">
    <label class="f" for="g_boss">Weiterbildungsbefugte/r</label>
    <input type="text" id="g_boss" value="${esc(sg?sg.boss:'')}">
    <label class="f" for="g_start">Beginn</label>
    <input type="date" id="g_start" value="${sg?sg.start:''}">
    <label class="f" for="g_end">Ende (leer lassen = laufend)</label>
    <input type="date" id="g_end" value="${sg?sg.end:''}">
    <label class="f" for="g_gap">Nicht anrechenbare Unterbrechung (Tage)</label>
    <input type="number" id="g_gap" min="0" max="3650" inputmode="numeric" value="${sg?sg.gap:0}">
    <p class="tiny muted" style="margin:4px 0 0">Nur Unterbrechungen eintragen, die über 6 Wochen je Kalenderjahr hinausgehen (§ 4 Abs. 4 WBO) – diese Tage werden abgezogen.</p>
    <div class="dact"><button class="btn pri" id="g_save">Speichern</button><button class="btn" id="g_cancel">Abbrechen</button></div>`);
  $('#g_cancel').onclick=closeDlg;
  $('#g_save').onclick=()=>{
    const o={type:$('#g_type').value,dept:$('#g_dept').value.trim(),boss:$('#g_boss').value.trim(),start:$('#g_start').value,end:$('#g_end').value,gap:Math.max(0,Math.floor(Number($('#g_gap').value)||0))};
    if(!o.start){toast('Bitte einen Beginn angeben.');return;}
    if(o.end&&o.end<o.start){toast('Das Ende liegt vor dem Beginn.');return;}
    if(sg) Object.assign(sg,o); else S.segments.push(Object.assign({id:uid()},o));
    save(); closeDlg(); toast('Abschnitt gespeichert'); refresh();
  };
}

/* ========== Export / Import ========== */
async function saveFile(name,mime,content){
  try{
    if(isIOS()&&navigator.share&&navigator.canShare){
      const file=new File([content],name,{type:mime});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name}); return true;}
    }
  }catch(e){ if(e&&e.name==='AbortError') return false; }
  try{
    const blob=new Blob([content],{type:mime}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); return true;
  }catch(e){toast('Speichern nicht möglich.');return false;}
}
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(';')).join('\r\n');}
async function exportJSON(){
  const stamp=new Date().toISOString();
  const o=Object.assign({exported:stamp,appVersion:APP_VERSION},S,{settings:Object.assign({},S.settings,{lastBackup:stamp})});
  const ok=await saveFile(`weiterbildung-anaesthesiologie-sicherung-${todayISO()}.json`,'application/json',JSON.stringify(o,null,1));
  if(ok){S.settings.lastBackup=stamp; save(); toast('Sicherung gespeichert'); refresh();}
}
function exportCsvProg(){
  const st=computeStats(); const rows=[['Kategorie','Gruppe','Art','Inhalt','Ebene','Richtzahl (Soll)','Ist','Fehlt','Status','Erstmals','Zuletzt']];
  ITEMS.forEach(it=>{const s=st[it.id];rows.push([CAT_BY[it.cat].title,it.group,KIND[it.k],it.t,it.level?'Unterpunkt':'',it.soll||'',it.soll?s.ist:(s.done?'abgezeichnet':''),it.soll?s.fehlt:'',s.done?'erfüllt':'offen',fmtD(s.first),fmtD(s.last)]);});
  saveFile(`weiterbildung-fortschritt-${todayISO()}.csv`,'text/csv;charset=utf-8',csv(rows));
}
function exportCsvEnt(){
  const rows=[['Datum','Kategorie','Inhalt','Anzahl','Simulation','Notiz']];
  S.entries.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).forEach(e=>{const it=BY[e.i];rows.push([fmtD(e.d),it?CAT_BY[it.cat].title:'',it?it.t:e.i,e.n,e.sim?'ja':'',e.note]);});
  saveFile(`weiterbildung-eintraege-${todayISO()}.csv`,'text/csv;charset=utf-8',csv(rows));
}
function exportCsvSeg(){
  const rows=[['Art','Abteilung/Weiterbildungsstätte','Weiterbildungsbefugte/r','Beginn','Ende','Unterbrechung (Tage)','Monate (Näherung)']];
  S.segments.slice().sort((a,b)=>a.start<b.start?-1:1).forEach(g=>rows.push([SEG_TYPES[g.type],g.dept,g.boss,fmtD(g.start),g.end?fmtD(g.end):'laufend',g.gap||'',nf1.format(segMonths(g))]));
  saveFile(`weiterbildung-zeiten-${todayISO()}.csv`,'text/csv;charset=utf-8',csv(rows));
}
function printReport(){
  const st=computeStats(), ts=timeStats(), a=aggregate(ITEMS,st);
  let h=`<h1>Weiterbildung Anästhesiologie – Fortschrittsbericht</h1>
  <div>${S.settings.name?esc(S.settings.name)+' · ':''}Stand: ${fmtD(todayISO())} · WBO Hessen 2020 (zuletzt geändert 23.11.2024)</div>
  <div>Gesamtfortschritt Inhalte: <b>${a.pct}%</b> · Richtzahlen erfüllt: ${a.nRd}/${a.nR} · Inhalte abgezeichnet: ${a.nId}/${a.nI}</div>
  <h2>Weiterbildungszeit</h2>
  <div>Gesamt angerechnet: <b>${nf1.format(ts.total)}</b> von ${REQ.total} Monaten · Intensivmedizin: ${nf1.format(ts.ik)} von mind. ${REQ.icu} Monaten · Andere Gebiete (angerechnet): ${nf1.format(ts.ag)} von höchstens ${REQ.other} Monaten</div>`;
  if(S.segments.length){
    h+=`<table><tr><th>Art</th><th>Abteilung / Stätte</th><th>Weiterbildungsbefugte/r</th><th>Beginn</th><th>Ende</th><th class="r">Monate</th></tr>`+
      S.segments.slice().sort((x,y)=>x.start<y.start?-1:1).map(g=>`<tr><td>${esc(SEG_TYPES[g.type])}</td><td>${esc(g.dept)}</td><td>${esc(g.boss)}</td><td>${fmtD(g.start)}</td><td>${g.end?fmtD(g.end):'laufend'}</td><td class="r">${nf1.format(segMonths(g))}</td></tr>`).join('')+'</table>';
  }
  CATS.forEach(c=>{
    const ca=aggregate(c.items,st);
    h+=`<h2>${esc(c.title)} <span style="font-weight:400;font-size:9pt">(${ca.pct}% · ${esc(c.ref)})</span></h2><table><tr><th>Inhalt</th><th>Art</th><th class="r">Soll</th><th class="r">Ist</th><th>Status</th></tr>`;
    c.items.forEach(it=>{const s=st[it.id];
      h+=`<tr class="${it.level?'sub':''}"><td>${esc(it.t)}</td><td>${it.k}</td><td class="r">${it.soll?nf0.format(it.soll):''}</td><td class="r">${it.soll?nf0.format(s.ist):''}</td><td>${s.done?(it.soll?'erfüllt':'abgezeichnet '+fmtD(s.first)):(it.soll?'noch '+nf0.format(s.fehlt):'offen')}</td></tr>`;});
    h+='</table>';
  });
  h+=`<p style="font-size:8.5pt">Persönliche Dokumentationshilfe; die verbindliche Dokumentation erfolgt im Logbuch der Landesärztekammer Hessen. K = Kenntnisse, F = Erfahrungen und Fertigkeiten.</p>
  <div class="sig"><div>Datum</div><div>Unterschrift Weiterzubildende/r</div><div>Unterschrift Weiterbildungsbefugte/r</div></div>`;
  $('#report').innerHTML=h;
  window.print();
}
async function importJSON(file){
  let o; try{o=JSON.parse(await file.text());}catch(e){toast('Die Datei konnte nicht gelesen werden.');return;}
  if(!o||o.app!==APP_ID||!Array.isArray(o.entries)){toast('Das ist keine gültige Sicherungsdatei dieser App.');return;}
  const inc=norm(o);
  const r=await ask({title:'Sicherung laden',text:`Die Datei enthält <b>${inc.entries.length}</b> Einträge und <b>${inc.segments.length}</b> Abschnitte. Aktuell vorhanden: ${S.entries.length} Einträge, ${S.segments.length} Abschnitte.<br><br><b>Ersetzen</b> überschreibt alle aktuellen Daten. <b>Zusammenführen</b> ergänzt nur, was hier noch fehlt.`,
    buttons:[{label:'Zusammenführen',cls:'pri',val:'merge'},{label:'Ersetzen',cls:'danger',val:'replace'},{label:'Abbrechen',val:null}]});
  if(!r) return;
  if(r==='replace'){inc.settings.lastBackup=S.settings.lastBackup; S=inc;}
  else{
    const ids=new Set(S.entries.map(e=>e.id)), sids=new Set(S.segments.map(s=>s.id));
    inc.entries.forEach(e=>{if(!ids.has(e.id)) S.entries.push(e);});
    inc.segments.forEach(s=>{if(!sids.has(s.id)) S.segments.push(s);});
  }
  save(); toast('Sicherung geladen'); go('daten');
}

/* ========== Ereignisse ========== */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, eid=el.dataset.eid;
  switch(act){
    case 'go': go(el.dataset.view); break;
    case 'dprev': selDate=addDays(selDate,-1); $('#d_sel').value=selDate; refresh(); break;
    case 'dnext': if(selDate<todayISO()){selDate=addDays(selDate,1); $('#d_sel').value=selDate; refresh();} break;
    case 'dtoday': selDate=todayISO(); $('#d_sel').value=selDate; refresh(); break;
    case 'inc': {
      const e={id:uid(),d:selDate,i:id,n:1,note:'',sim:false}; S.entries.push(e); save(); refresh();
      toast('+1 · '+BY[id].t.slice(0,48)+(BY[id].t.length>48?'…':''),()=>{S.entries=S.entries.filter(x=>x.id!==e.id);save();refresh();});
      break;}
    case 'dec': {
      const mine=S.entries.filter(e=>e.i===id&&e.d===selDate); const last=mine[mine.length-1]; if(!last) break;
      const snap=Object.assign({},last);
      if(last.n>1) last.n--; else S.entries=S.entries.filter(x=>x.id!==last.id);
      save(); refresh();
      toast('−1',()=>{const cur=S.entries.find(x=>x.id===snap.id); if(cur) cur.n=snap.n; else S.entries.push(snap); save(); refresh();});
      break;}
    case 'tog': {
      const mine=S.entries.filter(e=>e.i===id&&e.d===selDate);
      if(mine.length){const snap=mine.slice(); S.entries=S.entries.filter(e=>!(e.i===id&&e.d===selDate)); save(); refresh(); toast('Abzeichnung entfernt',()=>{S.entries.push(...snap);save();refresh();});}
      else{const e={id:uid(),d:selDate,i:id,n:1,note:'',sim:false}; S.entries.push(e); save(); refresh(); toast('Abgezeichnet · '+fmtD(selDate),()=>{S.entries=S.entries.filter(x=>x.id!==e.id);save();refresh();});}
      break;}
    case 'more': entryDialog(id,null,selDate); break;
    case 'detail': detailDialog(id); break;
    case 'ent-edit': entryDialog(S.entries.find(e=>e.id===eid).i,eid); break;
    case 'ent-del': deleteEntry(eid); break;
    case 'seg-add': segDialog(); break;
    case 'seg-edit': segDialog(eid); break;
    case 'seg-del': {
      const r=await ask({title:'Abschnitt löschen?',text:'Der Weiterbildungsabschnitt wird aus der Liste entfernt.',buttons:[{label:'Löschen',cls:'danger',val:true},{label:'Abbrechen',val:false}]});
      if(r){S.segments=S.segments.filter(s=>s.id!==eid);save();toast('Abschnitt gelöscht');refresh();}
      break;}
    case 'exp-json': exportJSON(); break;
    case 'imp-json': $('#imp_file').click(); break;
    case 'csv-prog': exportCsvProg(); break;
    case 'csv-ent': exportCsvEnt(); break;
    case 'csv-seg': exportCsvSeg(); break;
    case 'install': if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){} deferredPrompt=null; renderInstall();} break;
    case 'inst-hide': lsSet('wb_inst_dismissed','1'); renderInstall(); break;
    case 'print': printReport(); break;
    case 'reset': {
      const r=await ask({title:'Wirklich alles löschen?',text:'Alle Einträge, Abschnitte und Einstellungen werden unwiderruflich entfernt. Speichere vorher eine Sicherung, falls du die Daten noch brauchst.',buttons:[{label:'Alles löschen',cls:'danger',val:true},{label:'Abbrechen',val:false}]});
      if(r){S=fresh();save();toast('Alle Daten gelöscht');go('daten');}
      break;}
  }
});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('[role="button"][data-act="detail"]')){ev.preventDefault();ev.target.click();}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  switch(t.id){
    case 'f_q': ef.q=t.value.trim(); refresh(); break;
    case 'p_q': pf.q=t.value.trim(); refresh(); break;
    case 'v_q': vf.q=t.value.trim(); refresh(); break;
    case 's_name': S.settings.name=t.value; save(); break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  switch(t.id){
    case 'd_sel': if(t.value&&t.value<=todayISO()){selDate=t.value;refresh();} else {t.value=selDate;} break;
    case 'f_cat': ef.cat=t.value; refresh(); break;
    case 'f_open': ef.open=t.checked; refresh(); break;
    case 'p_cat': pf.cat=t.value; refresh(); break;
    case 'p_status': pf.status=t.value; refresh(); break;
    case 'v_cat': vf.cat=t.value; refresh(); break;
    case 'v_from': vf.from=t.value; refresh(); break;
    case 'v_to': vf.to=t.value; refresh(); break;
    case 's_roll': S.settings.rollup=t.checked; save(); toast(t.checked?'Unterpunkte zählen mit':'Unterpunkte zählen nicht mit'); break;
    case 'imp_file': if(t.files[0]) importJSON(t.files[0]); t.value=''; break;
  }
});
document.addEventListener('toggle',ev=>{
  const d=ev.target; if(!d.matches||!d.matches('details.cat')) return;
  if(d.open) openCats.add(d.dataset.key); else openCats.delete(d.dataset.key);
},true);
$('#dlg').addEventListener('click',ev=>{if(ev.target===ev.currentTarget) closeDlg();});
$('#dlg').addEventListener('close',()=>{ if(view!=='daten') refresh(); });

/* Start */
go('erfassen');
})();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
